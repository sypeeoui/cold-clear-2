[package]
name = "cold-clear-2"
version = "0.1.0"
authors = ["MinusKelvin <mark.carlson@minuskelvin.net>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ahash = "0.7.4"
bumpalo-herd = "0.1.1"
enum-map = "1.1.1"
enum_dispatch = "0.3.7"
enumset = "1.0.6"
futures = "0.3.15"
nohash = "0.2.0"
once_cell = "1.7.2"
ordered-float = "2.5.0"
ouroboros = "0.13.0"
parking_lot = "0.11.1"
puffin_crate = { package = "puffin", version = "0.10.0", optional = true }
puffin_http = { version = "0.7.0", optional = true }
rand = "0.8.3"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.64"
getrandom = { version = "0.2", features = ["js"], optional = true }
instant = { version = "0.1.12", features = ["wasm-bindgen"], optional = true }

# WASM dependencies
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
structopt = "0.3.25"

[features]
default = ["profiler"]
profiler = ["dep:puffin_crate", "dep:puffin_http"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook", "dep:getrandom", "dep:instant"]

[dev-dependencies]
criterion = "0.3.5"

[[bench]]
name = "movegen"
harness = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
